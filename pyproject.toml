[project]
name = "mcp-audit"
version = "0.1.0"
description = "Cross-server MCP security auditor with sandboxed exploit confirmation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
mcp-audit = "mcp_audit.cli:app"

