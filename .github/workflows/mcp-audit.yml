name: MCP Audit CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check src tests

    - name: Test with pytest
      run: |
        pytest tests/ -v 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}

    - name: Upload pytest log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-log
        path: pytest.log
        retention-days: 1

  audit:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install MCP Audit
      run: pip install .

    - name: Run MCP Audit self-scan
      run: |
        mcp-audit info
        echo "Scan completed (no live MCP servers in CI, which is expected)"
