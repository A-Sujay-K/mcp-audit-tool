services:
  api:
    image: python:3.12-slim
    command: uvicorn src.mcp_audit.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcp_audit
    depends_on:
      - db
    volumes:
      - .:/app
    working_dir: /app

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mcp_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dashboard:
    image: node:20-slim
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    working_dir: /app/dashboard
    volumes:
      - ./dashboard:/app/dashboard

volumes:
  pgdata:
